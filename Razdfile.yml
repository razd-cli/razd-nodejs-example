version: "1"

dependencies:
  using: "mise"

  ensure:
    - "task@latest"
    - "node@22"

tasks:
  default:
    desc: Set up Node.js project
    deps: [install]
    cmds:
      - task: dev
  install:
    desc: Install dependencies
    cmds:
      - echo "📦 Installing dependencies..."
      - npm install
  dev:
    desc: Start development server
    cmds:
      - echo "🚀 Starting development..."
      - npm run dev
  build:
    desc: Build project
    cmds:
      - echo "🔨 Building project..."
      - npm run build
