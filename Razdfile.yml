mise:
  tools:
    node: "22"
    task: latest
tasks:
  default:
    desc: Set up Node.js project
    cmds:
      - echo "🚀 Setting up Node.js project..."
      - task: install
      - task: dev
  install:
    desc: Install dependencies
    cmds:
      - mise trust
      - mise install
      - echo "📦 Installing dependencies..."
      - npm install
  dev:
    desc: Start development server
    cmds:
      - echo "🚀 Starting development..."
      - npm run dev
  build:
    desc: Build project
    cmds:
      - echo "🔨 Building project..."
      - npm run build

