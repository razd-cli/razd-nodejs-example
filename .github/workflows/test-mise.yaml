name: Test mise Integration with Razd

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  test-mise-razd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - uses: razd-cli/razd-action@v1.0.1
        with:
          mise-version: '2025.11.2'
          checkout-repository: 'true'
      
      - name: Use razd
        run: razd --version
      
      - name: Install npm dependencies
        run: razd install
      
      - name: Razd build
        run: |
          razd build

