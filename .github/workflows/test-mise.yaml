name: Test mise Integration with Razd

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  test-mise-razd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup mise and install tools
        uses: jdx/mise-action@v2
        with:
          version: 2024.12.14  # Use specific version instead of latest
          install: false  # Don't install yet, need to add razd plugin first
          cache: true
          experimental: true
      
      - name: Install razd
        run: |
          # Install razd plugin and tool
          mise plugin install razd https://github.com/razd-cli/vfox-plugin-razd
          mise use -g razd@latest
          
          # Now install all tools from mise.toml
          mise install
      
      - name: Verify installations
        run: mise list
      
      - name: Verify razd
        run: razd --version
      
      - name: Install npm dependencies
        run: razd install
      
      - name: Test server
        run: |
          razd dev &
          sleep 5
          curl -f http://localhost:3000
          echo "✅ Server OK!"

